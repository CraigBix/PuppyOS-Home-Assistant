# ============================================================
# PuppyOS - Desktop / Tablet Dashboard
# ============================================================
#
# PURPOSE:
# A wider PuppyOS dashboard for desktop computers, tablets
# and wall displays.
#
# This version uses the SAME helpers and automations as the
# mobile dashboard. Only the layout changes.
#
# FEATURES:
# - Puppy hero image
# - Three-meal status
# - Last feeding details
# - Food container status
# - Outside / toilet tracking
# - Garden gate safety
# - Weight and growth graph
# - Vaccinations
# - Parasite treatment
# - Microchip information
# - Vet / insurance shortcuts
# - Larger puppy camera
#
# Replace all example entity IDs and URLs with your own.
#
# CUSTOM CARDS USED:
#
# - Mushroom Cards
# - Button Card
# - Advanced Camera Card
# - Mini Graph Card
# - Card Mod
#
# ============================================================

type: grid
columns: 3
square: false
cards:

  # ==========================================================
  # LEFT COLUMN
  # HERO + OUTSIDE / SAFETY
  # ==========================================================

  - type: vertical-stack
    cards:

      # ------------------------------------------------------
      # HERO
      # ------------------------------------------------------

      - type: picture-elements
        image: /local/puppy.jpg

        elements:

          - type: custom:button-card
            show_name: false
            show_icon: false

            custom_fields:
              title: |
                [[[
                  return `🐾 PUPPY`;
                ]]]

            styles:
              card:
                - background: rgba(0,42,92,0.82)
                - border: 1px solid rgba(254,77,0,0.70)
                - border-radius: 14px
                - padding: 8px 18px
                - box-shadow: none

              custom_fields:
                title:
                  - color: white
                  - font-size: 28px
                  - font-weight: bold
                  - text-align: center

            style:
              top: 8%
              left: 50%
              width: 46%


      # ------------------------------------------------------
      # CURRENT WEIGHT
      # ------------------------------------------------------

      - type: custom:mushroom-template-card
        entity: input_number.puppy_weight

        primary: Current Weight

        secondary: |
          {{ states('input_number.puppy_weight') }} kg

        icon: mdi:scale
        icon_color: orange

        tap_action:
          action: more-info

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # OUTSIDE & SAFETY HEADER
      # ------------------------------------------------------

      - type: markdown
        content: |
          ## 🚪 Outside & Safety
        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
            }


      # ------------------------------------------------------
      # LAST OUTSIDE
      # ------------------------------------------------------

      - type: custom:mushroom-template-card
        primary: Last Outside

        secondary: |
          {% if is_state('binary_sensor.your_back_door_contact','on') %}

            Outside access open now

          {% else %}

            {% set last = states('input_datetime.puppy_last_outside') %}

            {% if last in ['unknown','unavailable','none',''] %}

              No data yet

            {% else %}

              {% set mins =
                ((as_timestamp(now()) - as_timestamp(last)) / 60) | int
              %}

              {% if mins < 60 %}
                {{ mins }} minutes ago
              {% else %}
                {{ (mins / 60) | round(1) }} hours ago
              {% endif %}

            {% endif %}
          {% endif %}

        icon: mdi:dog-side

        icon_color: |
          {% if is_state('binary_sensor.your_back_door_contact','on') %}

            green

          {% else %}

            {% set last = states('input_datetime.puppy_last_outside') %}

            {% if last in ['unknown','unavailable','none',''] %}

              grey

            {% else %}

              {% set mins =
                ((as_timestamp(now()) - as_timestamp(last)) / 60) | int
              %}

              {% if mins < 90 %}
                green
              {% elif mins < 120 %}
                orange
              {% else %}
                red
              {% endif %}

            {% endif %}
          {% endif %}

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.40) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # TOILET STATUS
      # ------------------------------------------------------

      - type: custom:mushroom-template-card
        primary: Toilet Status

        secondary: |
          {% set last = states('input_datetime.puppy_last_outside') %}

          {% if is_state('binary_sensor.your_back_door_contact','on') %}

            Garden access open

          {% elif last in ['unknown','unavailable','none',''] %}

            Waiting for first outing

          {% else %}

            {% set mins =
              ((as_timestamp(now()) - as_timestamp(last)) / 60) | int
            %}

            {% set remaining = 120 - mins %}

            {% if remaining > 60 %}
              Due in {{ (remaining / 60) | round(1) }} hours
            {% elif remaining > 0 %}
              Due in {{ remaining }} minutes
            {% else %}
              TOILET BREAK DUE
            {% endif %}

          {% endif %}

        icon: mdi:timer-outline

        icon_color: |
          {% set last = states('input_datetime.puppy_last_outside') %}

          {% if is_state('binary_sensor.your_back_door_contact','on') %}

            green

          {% elif last in ['unknown','unavailable','none',''] %}

            grey

          {% else %}

            {% set mins =
              ((as_timestamp(now()) - as_timestamp(last)) / 60) | int
            %}

            {% if mins < 90 %}
              green
            {% elif mins < 120 %}
              orange
            {% else %}
              red
            {% endif %}

          {% endif %}

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.40) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # GATE + BACK DOOR
      # ------------------------------------------------------

      - type: grid
        columns: 2
        square: false

        cards:

          - type: custom:mushroom-template-card
            entity: binary_sensor.your_garden_gate_contact
            primary: Garden Gate

            secondary: |
              {% if is_state('binary_sensor.your_garden_gate_contact','on') %}
                OPEN
              {% else %}
                CLOSED
              {% endif %}

            icon: |
              {% if is_state('binary_sensor.your_garden_gate_contact','on') %}
                mdi:gate-open
              {% else %}
                mdi:gate
              {% endif %}

            icon_color: |
              {% if is_state('binary_sensor.your_garden_gate_contact','on') %}
                red
              {% else %}
                green
              {% endif %}

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


          - type: custom:mushroom-template-card
            entity: binary_sensor.your_back_door_contact
            primary: Back Door

            secondary: |
              {% if is_state('binary_sensor.your_back_door_contact','on') %}
                OPEN
              {% else %}
                CLOSED
              {% endif %}

            icon: |
              {% if is_state('binary_sensor.your_back_door_contact','on') %}
                mdi:door-open
              {% else %}
                mdi:door-closed
              {% endif %}

            icon_color: |
              {% if is_state('binary_sensor.your_back_door_contact','on') %}
                orange
              {% else %}
                green
              {% endif %}

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


  # ==========================================================
  # CENTRE COLUMN
  # FOOD + CAMERA
  # ==========================================================

  - type: vertical-stack
    cards:

      # ------------------------------------------------------
      # FOOD HEADER
      # ------------------------------------------------------

      - type: markdown
        content: |
          ## 🍽️ Today's Meals
        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
            }


      # ------------------------------------------------------
      # BREAKFAST / LUNCH / DINNER
      # ------------------------------------------------------

      - type: grid
        columns: 3
        square: false

        cards:

          - type: custom:mushroom-template-card
            primary: Breakfast

            secondary: |
              {% set v = states('input_datetime.puppy_breakfast_fed') %}

              {% if
                v not in ['unknown','unavailable','none','']
                and as_datetime(v).date() == now().date()
              %}
                {{ as_datetime(v).strftime('%H:%M') }}
              {% else %}
                Not yet
              {% endif %}

            icon: mdi:food-apple

            icon_color: |
              {% set v = states('input_datetime.puppy_breakfast_fed') %}

              {% if
                v not in ['unknown','unavailable','none','']
                and as_datetime(v).date() == now().date()
              %}
                green
              {% elif now().hour > 10 or (now().hour == 10 and now().minute >= 30) %}
                red
              {% else %}
                grey
              {% endif %}

            layout: vertical

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


          - type: custom:mushroom-template-card
            primary: Lunch

            secondary: |
              {% set v = states('input_datetime.puppy_lunch_fed') %}

              {% if
                v not in ['unknown','unavailable','none','']
                and as_datetime(v).date() == now().date()
              %}
                {{ as_datetime(v).strftime('%H:%M') }}
              {% else %}
                Not yet
              {% endif %}

            icon: mdi:food

            icon_color: |
              {% set v = states('input_datetime.puppy_lunch_fed') %}

              {% if
                v not in ['unknown','unavailable','none','']
                and as_datetime(v).date() == now().date()
              %}
                green
              {% elif now().hour >= 15 %}
                red
              {% else %}
                grey
              {% endif %}

            layout: vertical

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


          - type: custom:mushroom-template-card
            primary: Dinner

            secondary: |
              {% set v = states('input_datetime.puppy_dinner_fed') %}

              {% if
                v not in ['unknown','unavailable','none','']
                and as_datetime(v).date() == now().date()
              %}
                {{ as_datetime(v).strftime('%H:%M') }}
              {% else %}
                Not yet
              {% endif %}

            icon: mdi:food-drumstick

            icon_color: |
              {% set v = states('input_datetime.puppy_dinner_fed') %}

              {% if
                v not in ['unknown','unavailable','none','']
                and as_datetime(v).date() == now().date()
              %}
                green
              {% elif now().hour > 19 or (now().hour == 19 and now().minute >= 30) %}
                red
              {% else %}
                grey
              {% endif %}

            layout: vertical

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


      # ------------------------------------------------------
      # LAST FED + FOOD CONTAINER
      # ------------------------------------------------------

      - type: grid
        columns: 2
        square: false

        cards:

          - type: custom:mushroom-template-card
            primary: Last Fed

            secondary: |
              {% set fed = states('input_datetime.puppy_last_fed') %}
              {% set meal = states('input_text.puppy_last_meal') %}

              {% if fed in ['unknown','unavailable','none',''] %}

                No meal recorded

              {% else %}

                {% set mins =
                  ((as_timestamp(now()) - as_timestamp(fed)) / 60) | int
                %}

                {% if meal in ['unknown','unavailable','none',''] %}
                  {% set meal = 'Meal' %}
                {% endif %}

                {% if mins < 60 %}
                  {{ meal }} • {{ mins }} mins ago
                {% else %}
                  {{ meal }} • {{ (mins / 60) | round(1) }} hrs ago
                {% endif %}

              {% endif %}

            icon: mdi:food-drumstick
            icon_color: green

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


          - type: custom:mushroom-template-card
            entity: binary_sensor.your_food_container_contact
            primary: Food Container

            secondary: |
              {% if is_state('binary_sensor.your_food_container_contact','on') %}
                OPEN
              {% elif is_state('binary_sensor.your_food_container_contact','off') %}
                CLOSED
              {% else %}
                Unavailable
              {% endif %}

            icon: mdi:jar

            icon_color: |
              {% if is_state('binary_sensor.your_food_container_contact','on') %}
                orange
              {% elif is_state('binary_sensor.your_food_container_contact','off') %}
                green
              {% else %}
                grey
              {% endif %}

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


      # ------------------------------------------------------
      # CAMERA
      # ------------------------------------------------------

      - type: markdown
        content: |
          ## 📹 Puppy Cam
        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
            }


      - type: custom:advanced-camera-card

        cameras:
          - camera_entity: camera.your_puppy_camera
            live_provider: auto

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
              box-shadow: 0 0 12px rgba(254,77,0,0.10);
              overflow: hidden;
            }


  # ==========================================================
  # RIGHT COLUMN
  # HEALTH + WEIGHT HISTORY + DOCUMENTS
  # ==========================================================

  - type: vertical-stack
    cards:

      # ------------------------------------------------------
      # HEALTH HEADER
      # ------------------------------------------------------

      - type: markdown
        content: |
          ## 🩺 Health
        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
            }


      # ------------------------------------------------------
      # LAST WEIGHED
      # ------------------------------------------------------

      - type: custom:mushroom-template-card
        entity: input_datetime.puppy_last_weighed
        primary: Last Weighed

        secondary: |
          {% set d = states('input_datetime.puppy_last_weighed') %}

          {% if d in ['unknown','unavailable','none',''] %}
            Not recorded
          {% else %}
            {{ as_datetime(d).strftime('%d %b %Y') }}
          {% endif %}

        icon: mdi:calendar-clock
        icon_color: orange

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.40) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # WEIGHT HISTORY
      # ------------------------------------------------------

      - type: custom:mini-graph-card
        name: Weight History
        icon: mdi:chart-line

        entities:
          - entity: input_number.puppy_weight
            name: Weight

        hours_to_show: 2160
        points_per_hour: 0.01
        line_width: 3

        show:
          name: true
          icon: true
          state: true
          labels: true
          points: true
          legend: false

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # VACCINATIONS
      # ------------------------------------------------------

      - type: grid
        columns: 2
        square: false

        cards:

          - type: custom:mushroom-template-card
            primary: Last Vaccination

            secondary: |
              {% set d = states('input_datetime.puppy_last_vaccination') %}

              {% if d in ['unknown','unavailable','none',''] %}
                Not recorded
              {% else %}
                {{ as_datetime(d).strftime('%d %b %Y') }}
              {% endif %}

            icon: mdi:needle
            icon_color: green

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


          - type: custom:mushroom-template-card
            entity: input_datetime.puppy_next_vaccination
            primary: Next Vaccination

            secondary: |
              {% set d = states('input_datetime.puppy_next_vaccination') %}

              {% if d in ['unknown','unavailable','none',''] %}
                Date not set
              {% else %}
                {{ as_datetime(d).strftime('%d %b %Y') }}
              {% endif %}

            icon: mdi:calendar-alert

            icon_color: |
              {% set d = states('input_datetime.puppy_next_vaccination') %}

              {% if d in ['unknown','unavailable','none',''] %}
                grey
              {% elif as_timestamp(d) < as_timestamp(now()) %}
                red
              {% elif as_timestamp(d) < as_timestamp(now()) + 604800 %}
                orange
              {% else %}
                green
              {% endif %}

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


      # ------------------------------------------------------
      # PARASITE TREATMENT
      # ------------------------------------------------------

      - type: custom:mushroom-template-card
        primary: Parasite Treatment

        secondary: |
          {% set treatment = states('input_text.puppy_parasite_treatment') %}
          {% set dose = states('input_text.puppy_parasite_dose') %}

          {% if treatment in ['unknown','unavailable','none',''] %}
            Treatment not entered
          {% else %}
            {{ treatment }}
          {% endif %}

          {% if dose not in ['unknown','unavailable','none',''] %}
            • {{ dose }}
          {% endif %}

        icon: mdi:pill
        icon_color: green

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # TREATMENT DATES
      # ------------------------------------------------------

      - type: grid
        columns: 2
        square: false

        cards:

          - type: custom:mushroom-template-card
            entity: input_datetime.puppy_last_parasite_treatment
            primary: Last Treatment

            secondary: |
              {% set d = states('input_datetime.puppy_last_parasite_treatment') %}

              {% if d in ['unknown','unavailable','none',''] %}
                Not recorded
              {% else %}
                {{ as_datetime(d).strftime('%d %b %Y') }}
              {% endif %}

            icon: mdi:calendar-check
            icon_color: green

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


          - type: custom:mushroom-template-card
            entity: input_datetime.puppy_next_parasite_treatment
            primary: Next Treatment

            secondary: |
              {% set d = states('input_datetime.puppy_next_parasite_treatment') %}

              {% if d in ['unknown','unavailable','none',''] %}
                Date not set
              {% else %}
                {{ as_datetime(d).strftime('%d %b %Y') }}
              {% endif %}

            icon: mdi:calendar-alert

            icon_color: |
              {% set d = states('input_datetime.puppy_next_parasite_treatment') %}

              {% if d in ['unknown','unavailable','none',''] %}
                grey
              {% elif as_timestamp(d) < as_timestamp(now()) %}
                red
              {% elif as_timestamp(d) < as_timestamp(now()) + 604800 %}
                orange
              {% else %}
                green
              {% endif %}

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.40) !important;
                  --primary-text-color: #ffffff;
                  --secondary-text-color: rgba(255,255,255,0.72);
                }


      # ------------------------------------------------------
      # MICROCHIP
      # ------------------------------------------------------

      - type: custom:mushroom-template-card
        entity: input_text.puppy_microchip

        primary: Microchip

        secondary: |
          Registered
          Tap to view number

        icon: mdi:identifier
        icon_color: green

        tap_action:
          action: more-info

        card_mod:
          style: |
            ha-card {
              background: #002a5c !important;
              color: #ffffff !important;
              border: 1px solid rgba(254,77,0,0.55) !important;
              --primary-text-color: #ffffff;
              --secondary-text-color: rgba(255,255,255,0.72);
            }


      # ------------------------------------------------------
      # QUICK INFORMATION BUTTONS
      # ------------------------------------------------------

      - type: grid
        columns: 3
        square: false

        cards:

          - type: button
            name: Vet
            icon: mdi:medical-bag

            tap_action:
              action: url
              url_path: https://example.com/your-vet

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.55) !important;
                }


          - type: button
            name: Insurance
            icon: mdi:shield-check

            tap_action:
              action: url
              url_path: /local/puppy_docs/insurance.pdf

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.55) !important;
                }


          - type: button
            name: Documents
            icon: mdi:file-document-multiple-outline

            tap_action:
              action: url
              url_path: /local/puppy_docs/

            card_mod:
              style: |
                ha-card {
                  background: #002a5c !important;
                  color: #ffffff !important;
                  border: 1px solid rgba(254,77,0,0.55) !important;
                }
